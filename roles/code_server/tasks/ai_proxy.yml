---
# Deploy AI API proxy that strips unsupported anthropic-beta headers
# Runs as systemd service on localhost

- name: Install aiohttp for AI proxy
  become: true
  ansible.builtin.pip:
    name: aiohttp
    executable: pip3

- name: Create AI proxy directory
  become: true
  ansible.builtin.file:
    path: /opt/ai-proxy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Place AI proxy script
  become: true
  ansible.builtin.template:
    src: api-proxy.py.j2
    dest: /opt/ai-proxy/api-proxy.py
    owner: root
    group: root
    mode: "0755"

- name: Place AI proxy credentials
  become: true
  ansible.builtin.template:
    src: api-proxy.env.j2
    dest: /opt/ai-proxy/credentials.env
    owner: root
    group: root
    mode: "0600"

- name: Place AI proxy systemd service
  become: true
  ansible.builtin.template:
    src: api-proxy.service.j2
    dest: /etc/systemd/system/ai-proxy.service
    owner: root
    group: root
    mode: "0644"

- name: Enable and start AI proxy service
  become: true
  ansible.builtin.systemd:
    name: ai-proxy
    daemon_reload: true
    enabled: true
    state: started

- name: Wait for AI proxy to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ code_server_proxy_port }}/"
    status_code: [200, 404]
  retries: 6
  delay: 5
  register: _proxy_health
  until: _proxy_health is not failed
