---
# Install Claude CLI for terminal usage
# Requires nvm, Node.js, and the @anthropic-ai/claude-code npm package

- name: Install nvm for Claude CLI
  become_user: "{{ code_server_user_name }}"
  ansible.builtin.shell:
    cmd: >-
      curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v{{ code_server_claude_nvm_version }}/install.sh | bash
    creates: "/home/{{ code_server_user_name }}/.nvm/nvm.sh"

- name: Install Node.js via nvm
  become_user: "{{ code_server_user_name }}"
  ansible.builtin.shell:
    cmd: >-
      source /home/{{ code_server_user_name }}/.nvm/nvm.sh &&
      nvm install {{ code_server_claude_node_version }}
    executable: /bin/bash
    creates: "/home/{{ code_server_user_name }}/.nvm/versions/node"

- name: Install Claude Code CLI via npm
  become_user: "{{ code_server_user_name }}"
  ansible.builtin.shell:
    cmd: >-
      source /home/{{ code_server_user_name }}/.nvm/nvm.sh &&
      npm install -g {{ code_server_claude_npm_package }}
    executable: /bin/bash
  register: _claude_cli_install
  changed_when: "'added' in _claude_cli_install.stdout"

- name: Pre-install mcp-remote to avoid cold-start download
  when: code_server_mcp_server_url | default('') | length > 0
  become_user: "{{ code_server_user_name }}"
  ansible.builtin.shell:
    cmd: >-
      source /home/{{ code_server_user_name }}/.nvm/nvm.sh &&
      npm install -g mcp-remote@{{ code_server_mcp_remote_version }}
    executable: /bin/bash
  register: _mcp_remote_install
  changed_when: "'added' in _mcp_remote_install.stdout"

- name: Create AAP gateway token for MCP authentication
  when:
    - code_server_mcp_server_url | default('') | length > 0
    - code_server_mcp_token | default('') | length == 0
  environment:
    GATEWAY_HOSTNAME: "{{ code_server_aap_gateway_host }}"
    GATEWAY_USERNAME: "{{ code_server_aap_gateway_username }}"
    GATEWAY_PASSWORD: "{{ code_server_aap_gateway_password }}"
    GATEWAY_VERIFY_SSL: "{{ code_server_aap_gateway_verify_ssl }}"
  ansible.platform.token:
    host: "{{ code_server_aap_gateway_host }}"
    username: "{{ code_server_aap_gateway_username }}"
    password: "{{ code_server_aap_gateway_password }}"
    validate_certs: "{{ code_server_aap_gateway_verify_ssl }}"
    description: MCP server authentication token
    scope: write
    state: present
  register: _gateway_token_result
  until: _gateway_token_result is not failed
  retries: 30
  delay: 10

- name: Set MCP token from gateway response
  when:
    - _gateway_token_result is defined
    - _gateway_token_result is not skipped
  ansible.builtin.set_fact:
    code_server_mcp_token: "{{ _gateway_token_result.ansible_facts.aap_token.token }}"

- name: Create .claude directory
  ansible.builtin.file:
    path: "/home/{{ code_server_user_name }}/.claude"
    state: directory
    owner: "{{ code_server_user_name }}"
    group: "{{ code_server_group_name }}"
    mode: "0700"

- name: Place Claude settings.json (env vars and permissions)
  ansible.builtin.template:
    src: claude-settings.json.j2
    dest: "/home/{{ code_server_user_name }}/.claude/settings.json"
    owner: "{{ code_server_user_name }}"
    group: "{{ code_server_group_name }}"
    mode: "0600"

- name: Place Claude .claude.json (MCP servers and onboarding)
  ansible.builtin.template:
    src: claude-mcp.json.j2
    dest: "/home/{{ code_server_user_name }}/.claude.json"
    owner: "{{ code_server_user_name }}"
    group: "{{ code_server_group_name }}"
    mode: "0600"

- name: Set Claude CLI environment variables in .bashrc
  ansible.builtin.blockinfile:
    path: "/home/{{ code_server_user_name }}/.bashrc"
    marker: "# {mark} CLAUDE CODE ENV"
    block: |
      export ANTHROPIC_BASE_URL="{{ code_server_claude_api_base_url }}"
      export ANTHROPIC_API_KEY="{{ code_server_claude_api_key }}"
      export ANTHROPIC_MODEL="{{ code_server_claude_default_model }}"
      export CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS=1
      # Add nvm to PATH for Claude CLI
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    owner: "{{ code_server_user_name }}"
    group: "{{ code_server_group_name }}"
